<style>
  :root{
    --pd-ink:#000;
    --pd-grey:#8C8C8C;
    --pd-line:#D9D9D9;
    --pd-media:#F2F2F2;
    --pd-blue:#1C00FF;
    --pd-font:'Golos Text','Helvetica Neue',Arial,sans-serif;
  }
  body{background:#fff}
  .pd,.pd *{box-sizing:border-box;margin:0;padding:0}
  .pd{font-family:var(--pd-font);color:var(--pd-ink);background:#fff;font-size:14px;line-height:1.2;letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .pd a{color:inherit;text-decoration:none}
  .pd button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
  .pd button:focus{outline:none}
  .pd a:focus,.pd button:focus-visible{outline:none}
  .pd img{display:block;width:100%;height:100%;object-fit:cover}
  .pd-logo{display:block;height:17px}
  .pd-logo img{height:100%;width:auto;object-fit:contain}
  .pd-header{position:fixed;top:16px;left:16px;right:16px;z-index:9990;transition:opacity .45s ease,transform .45s ease}
  .pd-header.is-away{opacity:0;transform:translateY(-12px);pointer-events:none}
  .pd-announce{position:relative;height:30px;overflow:hidden;border-radius:8px 8px 0 0;
    background:rgba(242,242,242,.75);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    font-size:11px;font-weight:500;letter-spacing:.01em}
  .pd-announce span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
  .pd-announce span.is-on{opacity:1}
  .pd-pill{position:relative;height:38px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;
    border-radius:0 0 8px 8px;background:#fff}
  .pd-nav{display:flex;align-items:center;gap:28px;font-size:13px;font-weight:500}
  .pd-nav--r{justify-content:flex-end}
  .pd-nav a:hover{color:var(--pd-blue)}
  .pd-mob{display:none}
  .pd-menu{display:none}
  .nf{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;color:#fff}
  .nf{background:#3d4650 center/cover no-repeat}
  .nf picture,.nf__hi{position:absolute;inset:0}
  .pd .nf img{object-position:55% 50%}
  .nf__hi{opacity:0;transition:opacity .5s ease}
  .nf__hi.is-on{opacity:1}
  .nf::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,0) 40%)}
  .nf__ph{position:absolute;inset:0;background:linear-gradient(180deg,#1a2640 0%,#131c30 100%)}
  .nf__ph span{position:absolute;right:24px;top:84px;font-size:10px;font-weight:500;letter-spacing:.06em;color:rgba(255,255,255,.32)}
  .nf__in{position:absolute;left:42px;bottom:56px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:22px;text-shadow:0 1px 14px rgba(0,0,0,.2)}
  .nf h1{font-size:clamp(28px,2.3vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1}
  .nf__sub{margin-top:4px;font-size:clamp(16px,1.3vw,22px);font-weight:600;letter-spacing:-.01em}
  .pd .nf__btn{display:flex;align-items:center;justify-content:center;width:clamp(200px,15vw,260px);height:46px;
    border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:#fff;font-size:15px;font-weight:500;text-shadow:none;transition:background .25s,border-color .25s}
  .pd .nf__btn:hover{background:var(--pd-blue);border-color:var(--pd-blue)}
  .pd-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:40px;margin:40px 16px 16px;padding:0 16px;
    border-radius:999px;background:#E8E9EB;font-size:12px;font-weight:500}
  .pd-foot__logo{display:block;height:13px}
  .pd-foot__logo img{height:100%;width:auto;object-fit:contain}
  .pd-foot__r{display:flex;justify-content:flex-end;align-items:center;gap:22px}
  .pd-foot__lang{display:flex;gap:3px;color:var(--pd-grey)}
  .pd-foot__lang a{color:var(--pd-ink)}
  .pd-foot a:hover{color:var(--pd-blue)}
  @media (max-width:820px){
    .pd-header{top:8px;left:10px;right:10px}
    .pd-announce{height:26px;font-size:10px}
    .pd-pill{height:40px;display:flex;justify-content:space-between;padding:0 12px}
    .pd-nav{display:none}
    .pd-logo{height:15px}
    .pd-logo img{margin-left:-23px}
    .pd-mob{display:flex;align-items:center;gap:16px}
    .pd-mob a,.pd .pd-mob button{display:flex;width:22px;height:22px;align-items:center;justify-content:center}
    .pd-mob svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}
    .pd-mob a:hover,.pd .pd-mob button:hover{color:var(--pd-blue)}
    .pd-burger .i-close{display:none}
    .pd-header.is-menu .pd-burger .i-open{display:none}
    .pd-header.is-menu .pd-burger .i-close{display:block}
    .pd-header.is-menu .pd-pill{border-radius:0}
    .pd-header.is-menu .pd-menu{display:block}
    .pd-menu{background:#fff;border-top:1px solid var(--pd-line);border-radius:0 0 8px 8px;padding:28px 16px 24px;text-align:center}
    .pd-menu a{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;padding:8px 0}
    .pd-menu a:hover{color:var(--pd-blue)}
    .pd-menu__lang{display:flex;justify-content:center;gap:18px;margin-top:22px}
    .pd-menu__lang a{font-size:15px}
    .pd-foot{grid-template-columns:1fr auto;grid-template-areas:"logo logo" "copy right";height:auto;row-gap:14px;
      margin:30px 10px 10px;padding:14px 16px;border-radius:20px}
    .pd-foot__logo{grid-area:logo;justify-self:center}
    .pd-foot__copy{grid-area:copy}
    .pd-foot__r{grid-area:right;gap:12px}
    .nf__ph span{top:80px;right:16px}
    .nf__in{left:16px;right:16px;bottom:40px;align-items:stretch;gap:18px}
    .nf h1{font-size:28px}
    .nf__sub{font-size:16px}
    .pd .nf__btn{width:100%;height:48px}
  }
</style>

(function () {
